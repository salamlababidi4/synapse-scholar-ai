services:
  db:
    image: pgvector/pgvector:pg17
    container_name: synapse-scholar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scholar
      POSTGRES_PASSWORD: scholar_dev_password
      POSTGRES_DB: synapse_scholar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholar -d synapse_scholar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: